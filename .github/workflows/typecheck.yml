name: Typecheck

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The TanStack router plugin rewrites src/routeTree.gen.ts during the
      # build. A stale committed tree typechecks fine locally but breaks CI
      # and production, so regenerate it and require it to be committed.
      - name: Regenerate route tree
        run: bun run build

      - name: Route tree must be committed (no stale generated file)
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Typecheck
        run: bun run typecheck