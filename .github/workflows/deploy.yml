# Git → Cloudflare automatic deploys.
#
#   push to master → builds and deploys the production worker `wacos`
#                    (https://wacos.mmwosasocials.workers.dev)
#   push to stg    → builds and deploys the preview worker `wacos-stg`
#                    (https://wacos-stg.mmwosasocials.workers.dev)
#
# Secrets live in GitHub Actions secrets; runtime secrets are (re-)pushed to
# the Workers on every deploy via scripts/sync-cf-secrets.mjs, so rotating a
# value in GitHub automatically rotates it on Cloudflare.
name: Deploy

on:
  push:
    branches: [master, stg]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: production
        type: choice
        options: [production, preview]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ github.ref_name == 'stg' && 'preview' || 'production' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'stg' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Merge wrangler vars (prod + stg configs)
        run: node scripts/patch-wrangler.mjs

      - name: Deploy to Cloudflare (production)
        if: github.ref_name != 'stg'
        run: bunx wrangler deploy -c .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare (preview / stg)
        if: github.ref_name == 'stg'
        run: bunx wrangler deploy -c .output/server/wrangler.stg.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync runtime secrets to Workers
        run: node scripts/sync-cf-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          ADMIN_SESSION_KEY: ${{ secrets.ADMIN_SESSION_KEY }}

      - name: Smoke test production
        if: github.ref_name != 'stg'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://wacos.mmwosasocials.workers.dev/)
          echo "GET / → $code"
          test "$code" = "200"

      - name: Smoke test preview
        if: github.ref_name == 'stg'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://wacos-stg.mmwosasocials.workers.dev/)
          echo "GET / → $code"
          test "$code" = "200"
